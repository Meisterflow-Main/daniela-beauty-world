name: Deploy HostFactory Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    env:
      VITE_BASE44_APP_BASE_URL: ${{ secrets.VITE_BASE44_APP_BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Verify build output
        run: |
          ls -lah dist
          test -f dist/index.html

      - name: Configure SSH
        run: |
          set -e

          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan \
            -H \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Package build
        run: |
          tar -czf dist.tar.gz -C dist .

      - name: Upload package
        run: |
          scp \
            -P "${{ secrets.SSH_PORT }}" \
            -i ~/.ssh/deploy_key \
            dist.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/dist.tar.gz"

      - name: Deploy to HostFactory
        run: |
          ssh \
            -p "${{ secrets.SSH_PORT }}" \
            -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'

          set -e

          mkdir -p "${{ secrets.DEPLOY_PATH }}"

          echo "Cleaning deployment directory..."

          find "${{ secrets.DEPLOY_PATH }}" \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".htaccess" \
            ! -name ".tmb" \
            -exec rm -rf {} +

          echo "Extracting website..."

          tar -xzf ~/dist.tar.gz \
            -C "${{ secrets.DEPLOY_PATH }}"

          rm -f ~/dist.tar.gz

          echo "Deployment completed."

          EOF

      - name: Cleanup runner
        run: rm -f dist.tar.gz

      - name: Finished
        run: echo "✅ Website deployed successfully."