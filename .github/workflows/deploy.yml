name: Deploy to HostFactory (Staging)

on:
  push:
    branches:
      - main

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    env:
      VITE_BASE44_APP_BASE_URL: ${{ secrets.VITE_BASE44_APP_BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build the site
        run: npm run build

      - name: Verify build output
        run: ls -la dist

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Package build
        run: |
          tar -czf dist.tar.gz -C dist .

      - name: Upload package
        run: |
          scp -P ${{ secrets.SSH_PORT }} \
            -i ~/.ssh/id_ed25519 \
            dist.tar.gz \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/dist.tar.gz

      - name: Deploy on HostFactory
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
            -i ~/.ssh/id_ed25519 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF

          mkdir -p "${{ secrets.DEPLOY_PATH }}"

          find "${{ secrets.DEPLOY_PATH }}" -mindepth 1 -maxdepth 1 \
            ! -name ".htaccess" \
            -exec rm -rf {} +

          tar -xzf ~/dist.tar.gz -C "${{ secrets.DEPLOY_PATH }}"

          rm ~/dist.tar.gz

          EOF

      - name: Done
        run: echo "Deployment completed successfully."