name: Deploy to HostFactory (Staging)

on:
  push:
    branches:
      - main

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      VITE_BASE44_APP_BASE_URL: ${{ secrets.VITE_BASE44_APP_BASE_URL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Show Node and npm versions
        run: |
          node -v
          npm -v

      - name: Verify project files
        run: |
          pwd
          ls -la
          test -f package.json || (echo "package.json not found!" && exit 1)

      - name: Install Dependencies
        run: npm ci

      - name: Verify Vite installation
        run: npx vite --version

      - name: Build Project
        run: npm run build

      - name: Verify Build Output
        run: |
          test -d dist || (echo "dist folder not found!" && exit 1)
          ls -lah dist

      - name: Deploy to HostFactory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "dist/*"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1

      - name: Deployment Complete
        run: echo "✅ Deployment Successful"